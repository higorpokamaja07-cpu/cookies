<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Faz o site se adaptar a telas menores (celulares) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título exibido na aba do navegador -->
    <title>Teste de Cookies - Tema Claro/Escuro</title>

    <style>
        /* Estilização padrão da página */
        body {
            font-family: Arial, sans-serif;
            transition: 0.3s; /* Suaviza a troca de tema */
            margin: 0;

            /* Faz o conteúdo ocupar a tela inteira */
            min-height: 100vh;

            /* Centraliza o conteúdo */
            display: flex;
            justify-content: center;
            align-items: center;

            /* Tema claro (padrão) */
            background-color: #f4f4f4;
            color: #222;
        }

        /* Caixa principal do conteúdo */
        .container {
            text-align: center;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background-color: white;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
        }

        /* Estilo do botão */
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: 0.2s;
        }

        /* Pequena animação ao passar o mouse */
        button:hover {
            transform: scale(1.05);
        }

        /* Estilo aplicado ao body quando o tema escuro estiver ativo */
        .dark {
            background-color: #1e1e1e;
            color: white;
        }

        /* Ajusta a cor da caixa principal no tema escuro */
        .dark .container {
            background-color: #2d2d2d;
        }
    </style>
</head>

<body>

    <!-- Conteúdo principal -->
    <div class="container">

        <h1>🍪 Teste de Cookies</h1>

        <p>
            Este site salva sua preferência de tema usando cookies.
        </p>

        <!-- Ao clicar no botão, executa a função alternarTema() -->
        <button onclick="alternarTema()">
            Alternar Tema
        </button>

        <!-- Local onde será exibido o tema salvo -->
        <p id="status"></p>

    </div>

    <script>

        /*
        ======================================
        FUNÇÃO: definirCookie()
        ======================================

        Cria um cookie no navegador.

        Parâmetros:
        - nome: nome do cookie.
        - valor: informação que será armazenada.
        - dias: tempo de duração do cookie.
        */
        function definirCookie(nome, valor, dias) {

            // Cria um objeto contendo a data atual
            const data = new Date();

            // Soma os dias desejados à data atual
            data.setTime(
                data.getTime() + (dias * 24 * 60 * 60 * 1000)
            );

            /*
            Cria o cookie.

            expires:
                define quando o cookie irá expirar.

            path=/:
                faz com que o cookie esteja disponível
                em todas as páginas do site.
            */
            document.cookie =
                nome + "=" + valor +
                "; expires=" + data.toUTCString() +
                "; path=/";
        }


        /*
        ======================================
        FUNÇÃO: obterCookie()
        ======================================

        Procura e retorna o valor de um cookie.
        */
        function obterCookie(nome) {

            // Exemplo: "tema="
            const nomeCookie = nome + "=";

            /*
            document.cookie retorna todos os cookies
            em uma única string.

            Exemplo:
            "tema=escuro; usuario=Igor"
            */
            const cookies = document.cookie.split(";");

            // Percorre todos os cookies
            for (let cookie of cookies) {

                // Remove espaços extras
                cookie = cookie.trim();

                /*
                Verifica se o cookie atual começa
                com o nome procurado.
                */
                if (cookie.indexOf(nomeCookie) === 0) {

                    /*
                    Retorna apenas o valor do cookie.

                    Exemplo:
                    "tema=escuro"

                    retorna:

                    "escuro"
                    */
                    return cookie.substring(nomeCookie.length);
                }
            }

            // Retorna null se não encontrar o cookie
            return null;
        }


        /*
        ======================================
        FUNÇÃO: alternarTema()
        ======================================

        Alterna entre tema claro e escuro.
        */
        function alternarTema() {

            /*
            Adiciona ou remove a classe "dark".

            Se existir → remove.
            Se não existir → adiciona.
            */
            document.body.classList.toggle("dark");

            let tema;

            /*
            Descobre qual tema está ativo
            para salvá-lo no cookie.
            */
            if (document.body.classList.contains("dark")) {
                tema = "escuro";
            } else {
                tema = "claro";
            }

            /*
            Salva o tema por 30 dias.
            */
            definirCookie("tema", tema, 30);

            /*
            Atualiza o texto exibido na tela.
            */
            atualizarStatus();
        }


        /*
        ======================================
        FUNÇÃO: atualizarStatus()
        ======================================

        Atualiza o texto informando qual tema
        está salvo no cookie.
        */
        function atualizarStatus() {

            // Obtém o valor do cookie "tema"
            const tema = obterCookie("tema");

            // Atualiza o conteúdo do parágrafo
            document.getElementById("status").textContent =
                "Tema salvo no cookie: " + tema;
        }


        /*
        ======================================
        window.onload
        ======================================

        Executa automaticamente quando a página
        termina de carregar.
        */
        window.onload = function() {

            // Procura se existe um cookie chamado "tema"
            const temaSalvo = obterCookie("tema");

            /*
            Se o tema salvo for "escuro",
            ativa o tema escuro automaticamente.
            */
            if (temaSalvo === "escuro") {
                document.body.classList.add("dark");
            }

            // Atualiza o texto informativo
            atualizarStatus();

            /*
            Exibe todos os cookies no console
            do navegador.

            Para visualizar:
            F12 → Console
            */
            console.log("Cookies atuais:", document.cookie);
        };

    </script>

</body>
</html>
